<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Office</title>
<style>
  /* палитра офиса: те же имена и в окошке строки меню (menubar.html) */
  :root {
    --bg: #14151f; --panel: #1c1d2b; --line: #2a2c40; --text: #e8e6f0; --muted: #8a8fb0; --gold: #f0c040; --ok: #4ade80; --off: #e05a5a;
    --floor: #2e3150; --wall: #191a29; --plate: #f4f1e8; --ink: #1d1f2e; --rim: #44486a;
    --gap: 16px; --px: 2px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, Helvetica, sans-serif; }
  body { display: grid; grid-template-columns: 1fr 340px; grid-template-rows: auto 1fr; height: 100vh; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--wall); }
  ::-webkit-scrollbar-thumb { background: var(--floor); border: 2px solid var(--wall); }

  /* пиксельная рамка: ступенька в углах, как у табличек на этажах */
  .pix, button, .seg, .sess, .err { box-shadow: 0 calc(-1 * var(--px)) 0 0 var(--c, var(--rim)), 0 var(--px) 0 0 var(--c, var(--rim)), calc(-1 * var(--px)) 0 0 0 var(--c, var(--rim)), var(--px) 0 0 0 var(--c, var(--rim)); }

  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 10px var(--gap); background: var(--wall); border-bottom: var(--px) solid var(--line); }
  header .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--off); flex: none; }
  header .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  header .title { font-weight: 700; letter-spacing: .04em; color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .status { color: var(--muted); font-size: 13px; white-space: nowrap; }
  header .spacer { flex: 1; }
  header button { flex: none; padding: 4px 10px; }
  header .total { font: 700 15px Menlo, monospace; color: var(--gold); }
  .sess .m .usd { color: var(--gold); font-family: Menlo, monospace; }

  button { --c: var(--rim); background: var(--floor); color: var(--text); border: 0; border-radius: 0; padding: 5px 12px; margin: var(--px); font: 600 12px -apple-system, Helvetica, sans-serif; letter-spacing: .03em; cursor: pointer; }
  button:hover { background: #3a3e63; }
  button:active { transform: translateY(1px); }
  button.main { --c: #a07d1c; background: var(--gold); color: var(--ink); }
  button.main:hover { background: #ffd35a; }
  button.warn { --c: #a03838; background: var(--off); color: #fff; }
  button:disabled { opacity: .55; cursor: default; transform: none; }

  main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px var(--gap); padding: 12px var(--gap) 0; color: var(--muted); font-size: 12px; }
  /* пустая подсказка не занимает места, иначе кнопка уезжает на новую строку */
  .bar .note { flex: 1 1 0; min-width: 0; }
  .bar .note:empty { display: none; }
  .bar .k { font: 600 11px Menlo, monospace; letter-spacing: .1em; text-transform: uppercase; margin-right: 6px; }
  .bar .group { display: flex; align-items: center; }

  /* переключатель-табличка вместо системного списка */
  .seg { display: inline-flex; background: var(--wall); margin: var(--px); }
  .seg button { box-shadow: none; margin: 0; background: transparent; color: var(--muted); font-weight: 500; padding: 4px 10px; }
  .seg button:hover { color: var(--text); background: var(--panel); }
  .seg button.on { background: var(--plate); color: var(--ink); font-weight: 700; }

  #office { flex: 1; overflow: auto; padding: var(--gap); min-height: 0; min-width: 0; }
  .stage { position: relative; width: 100%; --c: var(--line); }
  .stage canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; }
  .stage canvas.labels { position: absolute; inset: 0; height: 100%; pointer-events: none; image-rendering: auto; }
  .err { --c: var(--off); margin: 12px var(--gap) 0; padding: 8px 12px; background: #2a1820; color: #ffb0b0; font: 12px Menlo, monospace; white-space: pre-wrap; }

  aside { border-left: var(--px) solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  aside section { padding: 14px var(--gap); overflow: auto; }
  aside section.sessions { max-height: 45%; border-bottom: var(--px) solid var(--line); flex: none; }
  aside section.log { flex: 1; min-height: 0; }
  aside h2 { margin: 0 0 10px; font: 600 11px Menlo, monospace; letter-spacing: .12em; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
  aside h2 label { font: 500 12px -apple-system, Helvetica, sans-serif; letter-spacing: 0; cursor: pointer; display: flex; align-items: center; gap: 7px; }

  /* флажок: пиксельный квадрат с галочкой */
  input[type=checkbox] { appearance: none; -webkit-appearance: none; width: 14px; height: 14px; margin: 0; background: var(--wall); box-shadow: inset 0 0 0 var(--px) var(--rim); cursor: pointer; display: grid; place-content: center; }
  input[type=checkbox]:checked { background: var(--gold); box-shadow: inset 0 0 0 var(--px) #a07d1c; }
  input[type=checkbox]:checked::after { content: ''; width: 6px; height: 3px; border: solid var(--ink); border-width: 0 0 2px 2px; transform: translate(0, -1px) rotate(-45deg); }

  .sess { --c: transparent; display: block; width: calc(100% - 2 * var(--px)); text-align: left; margin: var(--px) var(--px) 8px; padding: 8px 10px; background: var(--bg); font: inherit; letter-spacing: 0; }
  .sess:hover { background: var(--floor); }
  .sess.sel { --c: var(--gold); background: var(--floor); }
  .sess .t { display: flex; gap: 8px; align-items: center; font-weight: 600; }
  .sess .t span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess .m { color: var(--muted); font-size: 12px; font-weight: 400; margin-top: 2px; padding-left: 16px; }
  .sess .d { width: 8px; height: 8px; border-radius: 50%; background: #4a4d68; flex: none; }
  .sess .d.live { background: var(--ok); }
  .sess .d.busy { background: var(--ok); box-shadow: 0 0 6px var(--ok); animation: blink 1.2s steps(2, jump-none) infinite; }
  @keyframes blink { 100% { opacity: .3; box-shadow: none; } }
  @media (prefers-reduced-motion: reduce) { .sess .d.busy { animation: none; } }
  .line { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .line time { color: var(--muted); font-family: Menlo, monospace; font-size: 12px; margin-right: 6px; }
  .line b { color: var(--gold); font-weight: 600; }
  .empty { color: var(--muted); }
  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; height: auto; }
    aside { border-left: 0; border-top: var(--px) solid var(--line); }
    aside section.sessions { max-height: none; }
  }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <span class="title" id="title">Agent Office</span>
  <span class="status" id="status">подключаюсь…</span>
  <span class="spacer"></span>
  <button id="gen" hidden>Сгенерировать офис</button>
  <span class="total" id="total"></span>
</header>
<main>
  <div class="bar">
    <span class="group"><span class="k">Офис</span><span class="seg" id="officeStyle"></span></span>
    <span class="group"><span class="k">Время</span><span class="seg" id="timeOfDay"></span></span>
    <span class="note" id="bannerText"></span>
  </div>
  <div class="err" id="err" hidden></div>
  <div id="office"><div class="stage">
    <canvas id="scene" width="320" height="240" aria-label="Офис агентов по этажам"></canvas>
    <canvas id="labels" class="labels" aria-hidden="true"></canvas>
  </div></div>
</main>
<aside>
  <section class="sessions">
    <h2>СЕССИИ <label><input type="checkbox" id="follow"> следить за активной</label></h2>
    <div id="sessions"><div class="empty">Ищу сессии…</div></div>
  </section>
  <section class="log">
    <h2>ЖУРНАЛ</h2>
    <div id="log"><div class="empty">Пока тихо.</div></div>
  </section>
</aside>
<script type="module">
// метка в адресе: после правок office.js браузер не держит старый модуль
const { roleName, money } = await import('./office.js?' + Date.now())
const { mountFloors, OFFICES, TIME_OPTIONS } = await import('./floors.js?' + Date.now())

const $ = id => document.getElementById(id)
const logBox = $('log'), dot = $('dot'), status = $('status')
const titleEl = $('title'), list = $('sessions'), follow = $('follow'), total = $('total')

let sessions = []
let current = location.hash.slice(1)   // выбранная сессия живёт в адресе
let live = null, lastText = '', lastDraw = 0

follow.checked = !current
function save(key, value) { try { localStorage.setItem(key, value) } catch {} }
try { if (!current && localStorage.getItem('office.follow') === '0') follow.checked = false } catch {}

const who = w => roleName(w, live?.office)
const bannerText = $('bannerText'), gen = $('gen')
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const hhmm = at => new Date(at).toTimeString().slice(0, 5)

function ago(at) {
  const m = Math.round((Date.now() - at) / 60000)
  if (m < 1) return 'только что'
  if (m < 60) return m + ' мин назад'
  return Math.floor(m / 60) + ' ч назад'
}

// этажи рисуются сами каждый кадр; сюда приходят только свежие данные
const errBox = $('err')
const floors = mountFloors($('scene'), $('labels'), e => {
  const msg = 'Офис не нарисовался: ' + (e?.stack || e)
  if (errBox.textContent !== msg) { errBox.textContent = msg; errBox.hidden = false }
})
// переключатели-таблички вместо системных списков
function segment(box, options, key, fallback, titles = {}) {
  let value = fallback
  try { value = localStorage.getItem(key) || fallback } catch {}
  if (!(value in options)) value = fallback
  box.innerHTML = Object.entries(options).map(([k, name]) =>
    `<button data-k="${k}"${titles[k] ? ` title="${esc(titles[k])}"` : ''}>${esc(name)}</button>`).join('')
  const mark = () => box.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.k === value))
  box.addEventListener('click', e => {
    const b = e.target.closest('button')
    if (!b || b.dataset.k === value) return
    value = b.dataset.k
    save(key, value)
    mark()
    restyle()
  })
  mark()
  return { get value() { return value } }
}
const styleSel = segment($('officeStyle'), Object.fromEntries(Object.entries(OFFICES).map(([k, o]) => [k, o.name])), 'office.style', 'cozy',
  Object.fromEntries(Object.entries(OFFICES).map(([k, o]) => [k, o.ref])))
const timeSel = segment($('timeOfDay'), TIME_OPTIONS, 'office.time', 'clock')
function restyle() {
  floors.setStyle(styleSel.value, timeSel.value)
}
restyle()

function draw(st) {
  floors.update(st)
  drawBanner(st.office)
  lastDraw = Date.now()
  const lines = st.log.slice(-80).reverse()
  logBox.innerHTML = lines.length === 0
    ? '<div class="empty">Пока тихо.</div>'
    : lines.map(l => `<div class="line"><time>${new Date(l.at).toTimeString().slice(0, 8)}</time><b>${esc(who(l.who))}</b> · ${esc(l.text)}</div>`).join('')
}

function drawList() {
  if (sessions.length === 0) {
    list.innerHTML = '<div class="empty">За сутки сессий не было.</div>'
    return
  }
  const html = sessions.map(s => {
    const cls = s.working ? 'busy' : s.isLive ? 'live' : ''
    const work = s.working ? `в работе ${s.working}` : ago(s.at)
    const agents = s.agents ? ` · агентов ${s.agents}` : ''
    const usd = s.cost ? ` · <span class="usd">${money(s.cost)}</span>` : ''
    return `<button class="sess${s.id === current ? ' sel' : ''}" data-id="${s.id}">
      <div class="t"><span class="d ${cls}"></span><span>${esc(s.title)}</span></div>
      <div class="m">${esc(s.project)} · ${work}${agents}${usd}</div></button>`
  }).join('')
  // не трогать список без перемен: иначе клик попадает в уже заменённую кнопку
  if (html !== list.dataset.html) {
    list.dataset.html = html
    list.innerHTML = html
  }
}

list.addEventListener('click', e => {
  const b = e.target.closest('.sess')
  if (!b) return
  follow.checked = false
  save('office.follow', '0')
  pick(b.dataset.id)
})

follow.addEventListener('change', () => {
  save('office.follow', follow.checked ? '1' : '0')
  if (follow.checked) autoPick()
})

function pick(id) {
  if (id === current) return
  current = id
  history.replaceState(null, '', '#' + id)
  lastText = ''
  drawList()
  pollState()
}

// самая активная: где больше всего работают, потом — где писали последней
function autoPick() {
  const best = [...sessions].sort((a, b) => (b.working - a.working) || (b.at - a.at))[0]
  if (best) pick(best.id)
}

async function pollSessions() {
  try {
    const res = await fetch('api/sessions', { cache: 'no-store' })
    if (!res.ok) throw new Error(res.status)
    sessions = await res.json()
    dot.classList.add('on')
    if (follow.checked || !sessions.some(s => s.id === current)) autoPick()
    drawList()
  } catch {
    dot.classList.remove('on')
    status.textContent = 'сервер офиса не отвечает'
  }
}

function drawBanner(o) {
  gen.hidden = !o.folder || o.folder === '?'
  if (gen.hidden) { bannerText.textContent = ''; return }
  const place = o.folder.replace(/^\/Users\/[^/]+/, '~')
  gen.disabled = !!o.generating
  gen.classList.toggle('main', !o.saved)
  if (o.generating) {
    bannerText.textContent = `Собираю офис для ${place}: смотрю, какие агенты есть, раздаю должности и столы. Около 20 секунд.`
    gen.textContent = 'Генерирую…'
  } else if (armed) {
    bannerText.textContent = 'Нынешняя раскладка столов заменится новой.'
    gen.textContent = 'Точно пересобрать?'
  } else if (o.saved) {
    bannerText.textContent = ''
    gen.textContent = 'Пересобрать офис'
  } else {
    bannerText.textContent = `Для папки ${place} офиса ещё нет: столы расставлены по плагинам, должности из названий агентов.`
    gen.textContent = 'Сгенерировать офис'
  }
  gen.classList.toggle('warn', armed && !o.generating)
}

function fail(text) {
  errBox.textContent = text
  errBox.hidden = false
  setTimeout(() => { if (errBox.textContent === text) errBox.hidden = true }, 8000)
}

// пересборка затирает раскладку: второй клик подтверждает, без системного окна
let armed = false, disarm = 0
gen.addEventListener('click', async () => {
  if (live?.office.saved && !armed) {
    armed = true
    drawBanner(live.office)
    clearTimeout(disarm)
    disarm = setTimeout(() => { armed = false; if (live) drawBanner(live.office) }, 5000)
    return
  }
  armed = false
  clearTimeout(disarm)
  gen.disabled = true
  live.office.generating = true
  drawBanner(live.office)
  try {
    const res = await fetch('api/office?s=' + encodeURIComponent(current), { method: 'POST' })
    if (!res.ok) fail('Офис не собрался: ' + ((await res.json()).error ?? res.status))
  } catch (e) {
    fail('Сервер офиса не ответил: ' + e)
  }
  lastText = ''
  pollSessions()
  pollState()
})

async function pollState() {
  if (!current) return
  try {
    const id = current
    const res = await fetch('api/state?s=' + encodeURIComponent(id), { cache: 'no-store' })
    if (!res.ok || id !== current) return
    const text = await res.text()
    if (text !== lastText) {
      lastText = text
      live = JSON.parse(text)
      draw(live)
    } else if (Date.now() - lastDraw > 30000) {
      draw(live)
    }
    const s = sessions.find(s => s.id === current)
    titleEl.textContent = s ? s.title : 'Agent Office'
    const working = live.agents.filter(a => a.isWorking).length + (live.producer.isBusy ? 1 : 0)
    total.textContent = money(live.cost)
    total.title = `${roleName('main', live.office)} ${money(live.producer.cost)}, агенты ${money(live.cost - live.producer.cost)}`
    status.textContent = !s ? '' : s.isLive ? `${s.project} · в работе ${working}` : `${s.project} · затихла ${ago(s.at)}`
  } catch {}
}

function empty() {
  return { agents: [], producer: { isBusy: false, activity: '', at: 0, calls: 0, cost: 0, model: '', tool: '' }, cost: 0, log: [], since: Date.now(),
    office: { folder: '', title: 'AGENT OFFICE', zones: [], guests: {}, saved: true } }
}

draw(empty())
await pollSessions()
pollState()
setInterval(pollSessions, 4000)
setInterval(pollState, 1000)
</script>
</body>
</html>
