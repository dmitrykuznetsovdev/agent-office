[package]
name = "agent-office"
version = "0.1.0"
edition = "2024"
description = "Pixel office for watching Claude Code and Codex agents at work"
license = "MIT"
publish = false

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "process"] }
